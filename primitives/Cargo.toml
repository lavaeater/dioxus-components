[package]
name = "dioxus-primitives"
version = "0.0.1"
edition = "2021"
rust-version = "1.92.0"
readme = "../README.md"
keywords = ["gui", "dioxus", "components", "primitives"]
categories = ["gui", "wasm"]
authors = ["Dioxus Labs", "DogeDark"]
license = "MIT OR Apache-2.0"
homepage = "https://dioxuslabs.com"
repository = "https://github.com/DioxusLabs/components"

[dependencies]
dioxus.workspace = true
dioxus-attributes = { path = "../dioxus-attributes" }
time = { version = "0.3.44", features = ["std", "macros", "parsing", "local-offset"] }
num-integer = "0.1.46"
tracing.workspace = true
serde = { version = "1.0", features = ["derive"] }
palette = "0.7.6"
# Timing utilities vendored in src/sdk_time.rs (see that file). These are the
# transitive deps `dioxus-sdk-time` used for `sleep` / `use_timeout`.
futures = "0.3.31"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
gloo-timers = { version = "0.3.0", features = ["futures"] }

[build-dependencies]
lazy-js-bundle = "0.7.9"

[dev-dependencies]
dioxus-ssr = "=0.8.0-alpha.1"

[features]
default = ["router"]
router = ["dioxus/router"]
web = ["time/wasm-bindgen"]
